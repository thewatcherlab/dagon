# Written by dagon (https://github.com/{%.WorkflowRepo%}). Comment /deploy on a
# pull request to publish it at https://pr-<number>.<domain>. The VPS removes a
# preview 24 hours after its last deploy.
name: preview

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  resolve:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/deploy') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Require the deploy comment
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          trimmed=$(printf '%s' "$BODY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          test "$trimmed" = '/deploy'
      - name: Read the pull request head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          sha=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  deploy:
    needs: resolve
    uses: {%.Uses%}
    with:
      slot: pr-${{ github.event.issue.number }}
      sha: ${{ needs.resolve.outputs.sha }}{%.With%}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
  comment:
    needs: deploy
    if: always() && github.event.issue.pull_request && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LINE: ${{ needs.deploy.outputs.line }}
        run: |
          body="${LINE:-the deploy failed; see the workflow run}"
          case "$LINE" in
            published*|unchanged*) body="$body"$'\n\n'"dagon removes this preview 24 hours after its last deploy. Comment /deploy to deploy it again." ;;
          esac
          gh pr comment "$NUMBER" --body "$body"
